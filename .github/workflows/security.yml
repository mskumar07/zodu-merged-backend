name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 3 * * 1"   # weekly, catches advisories published after the last change

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - employee-service
          - checklist-service
          - payroll-service
          - restaurant-service
          - retail-service
          - admin-service
          - file-service
          - packages/zodu-security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The lockfile must match package.json (installs exactly what ships).
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: ${{ matrix.service }}
      - run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ matrix.service }}

  test:
    name: tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - packages/zodu-security
          - api-gateway
          - file-service
          - employee-service
          - checklist-service
          - payroll-service
          - retail-service
          - restaurant-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: ${{ matrix.service }}
      - run: npm test
        working-directory: ${{ matrix.service }}

  auth-service:
    name: tests (auth-service)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # test/global-setup.js creates the auth_service_test database from test/schema.sql + migrations
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: auth-service
      - run: npm test
        working-directory: auth-service

  face-service:
    name: tests (face-service auth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install "fastapi==0.115.6" httpx pytest
      - run: pytest -q test_internal_auth.py
        working-directory: face-service
