version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /api-gateway
      - /auth-service
      - /employee-service
      - /restaurant-service
      - /retail-service
      - /payroll-service
      - /checklist-service
      - /admin-service
      - /file-service
      - /packages/zodu-security
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /face-service
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /api-gateway
      - /auth-service
      - /employee-service
      - /restaurant-service
      - /retail-service
      - /payroll-service
      - /checklist-service
      - /admin-service
      - /file-service
      - /face-service
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
