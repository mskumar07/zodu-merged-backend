# Throwaway MinIO + Postgres for file-service integration tests only.
#   docker compose -f file-service/docker-compose.test.yml up -d
#   cd file-service && FILE_IT=1 npm run test:integration
services:
  minio:
    image: pgsty/minio:latest   # minio/minio was removed from Docker Hub; community fork, drop-in compatible
    command: server /data
    ports: ["127.0.0.1:59000:9000"]
    environment:
      MINIO_ROOT_USER: it-admin
      MINIO_ROOT_PASSWORD: it-admin-secret
    tmpfs: [/data]

  postgres:
    image: postgres:16-alpine
    ports: ["127.0.0.1:55432:5432"]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: file_service
    tmpfs: [/var/lib/postgresql/data]
