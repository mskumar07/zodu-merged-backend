version: "3.9"

services:
  # Auth Service
  auth-service:
    image: vicky0015/zodu-backemd-retail-auth-service:latest
    container_name: retail-auth-service
    restart: always
    expose:
      - "3000"
    # INTERNAL_SERVICE_TOKEN_FILE (file-service access checks) and FILE_SERVICE_TOKEN
    # (its calls to file-service). Optional so
    # auth-service still deploys before file-service exists.
    env_file:
      - path: ./env/auth-service.prod.env
        required: false
    environment:
      FILE_SERVICE_URL: http://file-service:4007
      NODE_ENV: production
      PORT: 3000
      DB_HOSTNAME: 72.60.206.59
      DB_PORT:  5433
      DB_USERNAME: zoduprod
      DB_PASSWORD: zodu@2025
      DB_NAME: auth_service



  # Restaurant Service
  retail-service:
    image: vicky0015/zodu-backemd-retail-service:latest
    container_name: retail-service
    restart: always
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOSTNAME: 72.60.206.59
      DB_PORT:  5433
      DB_USERNAME: zoduprod
      DB_PASSWORD: zodu@2025
      DB_NAME: retail_service
      MINIO_HOST:  72.60.206.59
      MINIO_PORT: 9000
      MINIO_ACCESSKEY: zoduminio
      MINIO_SECRETKEY: zodu@2025
      MINIO_BUCKET_NAME: zodu
      PUBLIC_FILE_BASE_URL: https://api.zodu.in


  # Face Service — photo → face embedding for face-recognition attendance.
  # Stateless and internal: only employee-service calls it.
  face-service:
    image: vicky0015/zodu-backemd-retail-face-service:latest
    container_name: retail-face-service
    restart: always
    expose:
      - "8000"

  # Employee Service
  employee-service:
    image: vicky0015/zodu-backemd-retail-employee-service:latest
    container_name: retail-employee-service
    restart: always
    expose:
      - "3002"
    # FILE_SERVICE_TOKEN (file-service INTERNAL_SERVICE_TOKEN_*), kept off this file.
    env_file:
      - path: ./env/employee-service.prod.env
        required: false
    environment:
      FILE_SERVICE_URL: http://file-service:4007
      NODE_ENV: production
      PORT: 3002
      DB_HOSTNAME: 72.60.206.59
      DB_PORT:  5433
      DB_USERNAME: zoduprod
      DB_PASSWORD: zodu@2025
      DB_NAME: employee-service
      FACE_SERVICE_URL: http://face-service:8000
    depends_on:
      - face-service


  restaurant-service:
    image: vicky0015/zodu-backemd-restaurant-service:latest
    container_name: restaurant-service
    restart: always
    expose:
      - "3004"
    environment:
      NODE_ENV: production
      PORT: 3004
      DB_HOSTNAME: 72.60.206.59
      DB_PORT:  5433
      DB_USERNAME: zoduprod
      DB_PASSWORD: zodu@2025
      DB_NAME: restaurant_service
      MINIO_HOST:  72.60.206.59
      MINIO_PORT: 9000
      MINIO_ACCESSKEY: zoduminio
      MINIO_SECRETKEY: zodu@2025
      MINIO_BUCKET_NAME: zodu
      PUBLIC_FILE_BASE_URL: https://api.zodu.in


  payroll-service:
    image: vicky0015/zodu-backemd-payroll-service:latest
    container_name: payroll-service
    restart: always
    expose:
      - "3003"
    environment:
      NODE_ENV: production
      PORT: 3003
      DB_HOSTNAME: 72.60.206.59
      DB_PORT:  5433
      DB_USERNAME: zoduprod
      DB_PASSWORD: zodu@2025
      DB_NAME: payroll-service

  checklist-service:
    image: vicky0015/zodu-backemd-checklist-service:latest
    container_name: checklist-service
    restart: always
    expose:
      - "3005"
    environment:
      NODE_ENV: production
      PORT: 3005
      DB_HOSTNAME: 72.60.206.59
      DB_PORT:  5433
      DB_USERNAME: zoduprod
      DB_PASSWORD: zodu@2025
      DB_NAME: checklist-service
      MINIO_HOST:  72.60.206.59
      MINIO_PORT: 9000
      MINIO_ACCESSKEY: zoduminio
      MINIO_SECRETKEY: zodu@2025
      MINIO_BUCKET_NAME: zodu
      PUBLIC_FILE_BASE_URL: https://api.zodu.in


  # Admin Panel Service — staff-only console API. Reached ONLY through
  # api-gateway's /admin route, same as every other service here — no
  # published port of its own. Its own outbound calls to auth-service,
  # retail-service, etc. go straight over the internal network
  # (AUTH_SERVICE_URL etc.), the same way api-gateway's own proxy targets do.
  admin-service:
    image: vicky0015/zodu-backemd-retail-admin-service:latest
    container_name: retail-admin-service
    restart: always
    expose:
      - "3007"
    environment:
      NODE_ENV: production
      PORT: 3007
      DB_HOSTNAME: 72.60.206.59
      DB_PORT: 5433
      DB_USERNAME: zoduprod
      DB_PASSWORD: zodu@2025
      DB_NAME: admin_service
      APP_SECRET: zodu@2025adminsecret
      JWT_EXPIRES_IN: 8h
      INTERNAL_SERVICE_KEY: zodu@2025internalkey
      CORS_ORIGIN: https://admin.zodu.in
      AUTH_SERVICE_URL: http://auth-service:3000
      RETAIL_SERVICE_URL: http://retail-service:3001
      EMPLOYEE_SERVICE_URL: http://employee-service:3002
      PAYROLL_SERVICE_URL: http://payroll-service:3003
      RESTAURANT_SERVICE_URL: http://restaurant-service:3004
      CHECKLIST_SERVICE_URL: http://checklist-service:3005
    depends_on:
      - auth-service
      - retail-service
      - employee-service
      - payroll-service
      - checklist-service

  # File Service — the only service with MinIO credentials. Reached only through
  # api-gateway's /files route (no published port). Secrets come from the
  # env_file on the host, never from this file (see file-service/.env.example).
  file-service:
    image: vicky0015/zodu-backemd-file-service:latest
    container_name: retail-file-service
    restart: always
    expose:
      - "4007"
    env_file:
      - ./env/file-service.prod.env
    environment:
      NODE_ENV: production
      PORT: 4007
      MINIO_BUCKET_NAME: zodu-files
      PRESIGNED_URL_TTL: 900
      PUBLIC_FILE_BASE_URL: https://api.zodu.in
      AUTH_SERVICE_URL: http://auth-service:3000
      REDIS_URL: redis://redis:6379
      MAX_CONCURRENT_UPLOADS: 4
    depends_on:
      - redis
      - auth-service

  # Shared rate-limit counters for file-service replicas. Internal only, no
  # persistence: losing it just resets the current minute's counters.
  redis:
    image: redis:7.4-alpine
    container_name: retail-redis
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"

  # API Gateway
  apigateway:
    image: vicky0015/zodu-backemd-retail-apigateway:latest
    container_name: retail-apigateway
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      AUTH_SERVICE_URL: http://auth-service:3000
      RETAIL_SERVICE_URL: http://retail-service:3001
      EMPLOYEE_SERVICE_URL: http://employee-service:3002
      RESTAURANT_SERVICE_URL: http://restaurant-service:3004
      PAYROLL_SERVICE_URL: http://payroll-service:3003
      CHECKLIST_SERVICE_URL: http://checklist-service:3005
      ADMIN_SERVICE_URL: http://admin-service:3007
      FILE_SERVICE_URL: http://file-service:4007
    depends_on:
      - auth-service
      - retail-service
      - employee-service
      - restaurant-service
      - payroll-service
      - checklist-service
      - admin-service

      - file-service